تعددة العوامل","question":"Is MFA enforced for remote access, email, privileged accounts and clinical applications wherever safely feasible?","question_ar":"هل تُفرض المصادقة متعددة العوامل على الوصول عن بُعد والبريد والحسابات المميزة والتطبيقات الطبية حيثما أمكن بأمان؟","actions":["Review MFA coverage by user group, application and exception.","Protect priority remote/administrative access and document clinical break-glass exceptions.","Test enforcement using a non-production test account."],"actions_ar":["مراجعة تغطية المصادقة حسب المستخدم والتطبيق والاستثناء.","حماية الوصول البعيد والإداري وتوثيق استثناءات الطوارئ الطبية.","اختبار التطبيق باستخدام حساب اختباري غير إنتاجي."],"evidence":"Identity-provider policy, MFA coverage report, exceptions","evidence_ar":"سياسات مزود الهوية وتقرير التغطية والاستثناءات","why":"MFA reduces account-takeover risk while healthcare workflows require safe exceptions.","why_ar":"تقلل المصادقة المتعددة اختراق الحسابات مع ضرورة مراعاة الطوارئ الطبية.","severity":"High","likelihood":"High","owner":"IAM Manager","urgency":"Immediate"},{"id":"IAM-03","domain":"IAM","student":1,"control":"AC-6 — Least Privilege","nist_label":"NIST SP 800-53 Rev. 5 — AC-6 — Least Privilege","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Separate User and Privileged Accounts","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Privileged access separation","title_ar":"فصل الحسابات ذات الصلاحيات العالية","question":"Do administrators use separate privileged accounts with only approved permissions and regular reviews?","question_ar":"هل يستخدم المسؤولون حسابات إدارية منفصلة بصلاحيات معتمدة ومراجعات دورية؟","actions":["Compare admin groups with approved privileged access register.","Remove excessive permissions and separate daily-use and admin identities.","Review emergency admin access and logging."],"actions_ar":["مقارنة المجموعات الإدارية بسجل الصلاحيات المعتمد.","إزالة الصلاحيات الزائدة وفصل حسابات st.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Network Segmentation","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Medical device network segmentation","title_ar":"عزل شبكة الأجهزة الطبية","question":"Are medical devices, guest Wi-Fi, clinical servers and corporate IT separated by controlled network boundaries?","question_ar":"هل تُفصل الأجهزة الطبية وشبكة الضيوف والخوادم العلاجية وتقنية المعلومات بحدود شبكية محكومة؟","actions":["Review VLAN architecture and permitted inter-zone flows.","Verify deny-by-default controls around critical clinical devices.","Test a restricted path under an authorized test plan."],"actions_ar":["مراجعة تصميم الشبكات الافتراضية وتدفقات الاتصال المسموحة.","التحقق من منع الوصول افتراضيًا حول الأجهزة الطبية الحرجة.","اختبار مسار محظور ضمن خطة اختبار معتمدة."],"evidence":"Network diagram, firewall policies, segmentation test","evidence_ar":"مخططات الشبكة وقواعد الجدار الناري واختبار العزل","why":"Segmentation limits ransomware spread and protects devices supporting patient care.","why_ar":"يحد عزل الشبكات انتشار برمجيات الفدية ويحمي أجهزة رعاية المرضى.","severity":"High","likelihood":"High","owner":"Network Manager","urgency":"Immediate"},{"id":"NET-02","domain":"NET","student":1,"control":"AC-17 — Remote Access","nist_label":"NIST SP 800-53 Rev. 5 — AC-17 — Remote Access","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Multifactor Authentication","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Controlled remote vendor access","title_ar":"ضبط وصول الموردين عن بُعد","question":"Is vendor remote support to imaging and clinical devices approved, time-limited, authenticated and monitored?","question_ar":"هل تخضع صيانة الموردين عن بُعد لأجهزة التصوير والعلاج للموافقة وتحديد المدة والمصادقة والمراقبة؟","actions":["List vendor remote connections and their business owners.","Enforce named identities, MFA and time-bound approval.","Review session logs and close stale remote tunnels."],"actions_ar":["حصر اتصالات الموردين الخارجية والجهة المسؤولة.","فرض حسابات فردية ومصادقة متعددة وموافقة محددة المدة.","مراجعة سجلات الجلسات وإغلاق الاتصالات القديمة."],"evidence":"VPN gateway logs, vendor access approvals, session records","evidence_ar":"سجلات البوابة وموافقات الموردين وتسجيلات الجلسات","why":"Uncontrolled supplier access creates a path into sensitive hospital networks.","why_ar":"يمثل وصول الموردين غير المحكوم منفذًا إلى شبكات المستشفى الحساسة.","severity":"High","likelihood":"High","owner":"Network Manager","urgency":"Immediate"},{"id":"NET-03","domain":"NET","student":1,"control":"SC-7 — Boundary Protection","nist_label":"NIST SP 800-53 Rev. 5 — SC-7 — Boundary Protection","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Network Segmentation","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Firewall rule governance","title_ar":"حوكمة قواعد الجدار الناري","question":"Are perimeter and internal firewall rules documented, least-permissive and reviewed periodically?","question_ar":"هل قواعد الجدران النارية الخارجية والداخلية موثقة ومقيدة للحد الأدنى وتُراجع دوريًا؟","actions":["Inspect rules for broad any-to-any and unused entries.","Tie each rule to an owner, change ticket and expiry where applicable.","Remove risky rules through approved change control."],"actions_ar":["فحص القواعد المفتوحة بلا قيود والقواعد غير المستخدمة.","ربط كل قاعدة بمسؤول وطلب تغيير وتاريخ انتهاء عند الحاجة.","إزالة القواعد الخطرة عبر إدارة التغيير."],"evidence":"Rule-base export, change approvals, review log","evidence_ar":"تصدير القواعد وموافقات التغيير وسجل المراجعة","why":"Overly permissive rules weaken isolation of sensitive hospital services.","why_ar":"تُضعف القواعد المتساهلة حماية خدمات المستشفى الحساسة.","severity":"Medium","likelihood":"Medium","owner":"Network Manager","urgency":"1–3 months"},{"id":"NET-04","domain":"NET","student":1,"control":"SC-8 — Transmission Confidentiality and Integrity","nist_label":"NIST SP 800-53 Rev. 5 — SC-8 — Transmission Confidentiality and Integrity","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Strong Encryption","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Secure clinical communications","title_ar":"تأمين الاتصالات العلاجية","question":"Are patient data transfers and clinical interfaces protected against interception and tampering in transit?","question_ar":"هل تُحمى عمليات نقل بيانات المرضى والواجهات الطبية من التنصت والتلاعب أثناء النقل؟","actions":["Inventory EHR APIs, patient portals and HL7/FHIR interfaces.","Verify TLS configurations, certificate expiry and approved secure transport.","Remediate cleartext interfaces through safe clinical change windows."],"actions_ar":["حصر واجهات السجل الطبي وبوابة المرضى وتكاملات HL7/FHIR.","التحقق من إعدادات TLS وصلاحية الشهادات والنقل الآمن.","معالجة الاتصالات غير المشفرة في مواعيد تغيير آمنة طبيًا."],"evidence":"TLS scan results, interface inventory, certificates","evidence_ar":"نتائج فحص TLS وقائمة الواجهات والشهادات","why":"Exposed traffic can reveal or alter patient and treatment information.","why_ar":"قد يكشف الاتصال غير الآمن معلومات المرضى أو يسمح بتعديلها.","severity":"High","likelihood":"Medium","owner":"Network Manager","urgency":"1–2 weeks"},{"id":"AST-01","domain":"AST","student":2,"control":"CM-8 — System Component Inventory","nist_label":"NIST SP 800-53 Rev. 5 — CM-8 — System Component Inventory","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Asset Inventory","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Complete healthcare asset inventory","title_ar":"حصر شامل لأصول المستشفى","question":"Is there an up-to-date inventory of servers, laptops, medical devices, cloud services and software owners?","question_ar":"هل يوجد جرد محدث للخوادم والحواسيب والأجهزة الطبية والخدمات السحابية مع تحديد ملاكها؟","actions":["Reconcile CMDB with endpoint discovery, procurement and biomedical inventory.","Identify unmanaged assets and assign owners.","Record lifecycle, criticality and supported operating system."],"actions_ar":["مطابقة سجل الأصول مع اكتشاف الأجهزة والمشتريات والجرد الطبي.","تحديد الأصول غير المُدارة وتعيين مسؤولين عنها.","توثيق دورة الحياة والأهمية ونظام التشغيل المدعوم."],"evidence":"CMDB export, device-discovery sample, ownership register","evidence_ar":"سجل الأصول ونتائج الاكتشاف وسجل المسؤوليات","why":"Unknown devices cannot be monitored, patched or included in response plans.","why_ar":"لا يمكن مراقبة أو تحديث أو حماية الأجهزة غير المعروفة.","severity":"High","likelihood":"Medium","owner":"IT Asset Manager","urgency":"1–2 weeks"},{"id":"AST-02","domain":"AST","student":2,"control":"RA-5 — Vulnerability Monitoring and Scanning","nist_label":"NIST SP 800-53 Rev. 5 — RA-5 — Vulnerability Monitoring and Scanning","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Mitigate Known Vulnerabilities","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Risk-based vulnerability scans","title_ar":"فحص الثغرات حسب المخاطر","question":"Are internet-facing and internal assets scanned for vulnerabilities with a safe approach for medical devices?","question_ar":"هل تُفحص الأصول المواجهة للإنترنت والداخلية بحثًا عن الثغرات مع مراعاة سلامة الأجهزة الطبية؟","actions":["Inspect scan coverage, exceptions and latest findings.","Agree safe passive/vendor-approved methods for sensitive medical equipment.","Create tracked remediation tickets for high-risk exposures."],"actions_ar":["فحص نطاق المسح والاستثناءات وأحدث النتائج.","تحديد أساليب فحص آمنة وسلبية أو معتمدة من المورد للأجهزة الحساسة.","فتح طلبات معالجة للثغرات مرتفعة الخطورة."],"evidence":"Scan reports, exceptions, remediation ticket list","evidence_ar":"تقارير الفحص والاستثناءات وتذاكر المعالجة","why":"Known flaws may permit ransomware compromise; unsafe active scans may disrupt care.","why_ar":"قد تسمح الثغرات المعروفة بهجمات الفدية، بينما قد يعطل الفحص العنيف الأجهزة الطبية.","severity":"High","likelihood":"High","owner":"Vulnerability Manager","urgency":"Immediate"},{"id":"AST-03","domain":"AST","student":2,"control":"SI-2 — Flaw Remediation","nist_label":"NIST SP 800-53 Rev. 5 — SI-2 — Flaw Remediation","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Mitigate Known Vulnerabilities","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Patch and compensating-control process","title_ar":"التحديثات والضوابط التعويضية","question":"Are security patches prioritized by exploitability and patient impact, with compensating controls for unpatchable devices?","question_ar":"هل تُرتب تحديثات الأمان حسب قابلية الاستغلال وتأثيرها على المرضى مع ضوابط بديلة للأجهزة غير القابلة للتحديث؟","actions":["Sample critical patch records and exception approvals.","Confirm clinical validation before patching life-supporting systems.","Segment or monitor unsupported devices and approve risk exceptions."],"actions_ar":["فحص سجلات التحديثات الحرجة وموافقات الاستثناء.","التأكد من الاعتماد الطبي قبل تحديث أنظمة دعم الحياة.","عزل الأجهزة غير المدعومة أو مراقبتها وتوثيق قبول المخاطر."],"evidence":"Patch compliance report, change windows, exception register","evidence_ar":"تقرير التحديثات وجداول التغيير وسجل الاستثناءات","why":"Delayed fixes extend exposure while unscheduled updates can affect availability.","why_ar":"يزيد تأخير الإصلاحات فرص الاستغلال بينما قد تؤثر التحديثات غير المخططة في التوافر.","severity":"High","likelihood":"High","owner":"Vulnerability Manager","urgency":"Immediate"},{"id":"AST-04","domain":"AST","student":2,"control":"CM-2 — Baseline Configuration","nist_label":"NIST SP 800-53 Rev. 5 — CM-2 — Baseline Configuration","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Configuration Management","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Secure system configuration baselines","title_ar":"الإعدادات الأمنية القياسية","question":"Are approved hardened baselines defined and monitored for servers, endpoints and supported clinical workstations?","question_ar":"هل توجد إعدادات أمنية قياسية معتمدة ويتم التحقق منها للخوادم والأجهزة ومحطات العمل الطبية؟","actions":["Review baseline version, approval and applicable exceptions.","Compare sampled device configurations against baseline.","Correct unauthorized drift using controlled changes."],"actions_ar":["مراجعة نسخة الإعداد القياسي واعتماده واستثناءاته.","مقارنة إعدادات أجهزة مختارة مع الإعداد القياسي.","تصحيح الانحرافات غير المصرح بها بإجراءات معتمدة."],"evidence":"Configuration baseline, compliance scan, changes","evidence_ar":"وثيقة الإعدادات القياسية ونتائج المطابقة وطلبات التغيير","why":"Consistent baselines reduce avoidable exposure and configuration drift.","why_ar":"تقلل الإعدادات الموحدة الثغرات الناتجة عن التهيئة الخاطئة.","severity":"Medium","likelihood":"Medium","owner":"Infrastructure Manager","urgency":"1–3 months"},{"id":"DAT-01","domain":"DAT","student":2,"control":"SC-28 — Protection of Information at Rest","nist_label":"NIST SP 800-53 Rev. 5 — SC-28 — Protection of Information at Rest","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"","hhs_url":"","title":"Encryption of stored patient records","title_ar":"تشفير سجلات المرضى المخزنة","question":"Is sensitive patient information protected at rest on databases, backups and portable endpoints?","question_ar":"هل تُحمى بيانات المرضى الحساسة أثناء التخزين في قواعد البيانات والنسخ الاحتياطية والأجهزة المحمولة؟","actions":["Identify PHI-bearing databases, disks and removable storage.","Verify approved encryption settings and key custody.","Remediate uncovered systems and document residual risk."],"actions_ar":["تحديد قواعد البيانات والأقراص والوسائط الحاملة لبيانات المرضى.","التحقق من التشفير المعتمد وإدارة مفاتيحه.","معالجة الأنظمة غير المحمية وتوثيق المخاطر المتبقية."],"evidence":"Encryption policy, database/storage settings, key-management records","evidence_ar":"سياسة التشفير وإعدادات التخزين وسجلات إدارة المفاتيح","why":"Lost systems or media can expose large volumes of patient information.","why_ar":"قد يؤدي فقد الأجهزة أو الوسائط إلى كشف كميات كبيرة من بيانات المرضى.","severity":"High","likelihood":"Medium","owner":"Data Protection Lead","urgency":"1–2 weeks"},{"id":"DAT-02","domain":"DAT","student":2,"control":"SC-8 — Transmission Confidentiality and Integrity","nist_label":"NIST SP 800-53 Rev. 5 — SC-8 — Transmission Confidentiality and Integrity","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Strong Encryption","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Encrypted inter-hospital exchange","title_ar":"تشفير تبادل البيانات بين المستشفيات","question":"Are transmissions between hospital sites, laboratories and external healthcare partners encrypted and integrity-protected?","question_ar":"هل يُشفَّر نقل البيانات بين فروع المستشفى والمختبرات والشركاء الطبيين مع حماية سلامتها؟","actions":["Map integration flows with destination and protocol.","Inspect transport encryption for representative interfaces.","Replace insecure channels with approved secure transfer methods."],"actions_ar":["رسم مسارات التكامل مع الوجهات والبروتوكولات.","فحص تشفير النقل لعينة من الواجهات.","استبدال القنوات غير الآمنة بطرق تبادل معتمدة."],"evidence":"Data-flow maps, interface contracts, TLS/SFTP verification","evidence_ar":"خرائط تدفق البيانات وعقود الواجهات والتحقق من TLS/SFTP","why":"Cross-site transfers create high-volume opportunities for interception.","why_ar":"تشكل عمليات النقل بين المواقع فرصًا لاعتراض بيانات كثيرة.","severity":"High","likelihood":"Medium","owner":"Data Protection Lead","urgency":"1–2 weeks"},{"id":"DAT-03","domain":"DAT","student":2,"control":"AC-4 — Information Flow Enforcement","nist_label":"NIST SP 800-53 Rev. 5 — AC-4 — Information Flow Enforcement","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"","hhs_url":"","title":"Approved patient-data flows","title_ar":"حوكمة مسارات بيانات المرضى","question":"Are exports and interfaces containing patient data restricted to approved destinations and purposes?","question_ar":"هل تُقصر صادرات بيانات المرضى والواجهات على الجهات والأغراض المعتمدة؟","actions":["Inventory outbound EHR integrations and file exports.","Validate access rules and approval for third-party destinations.","Block unauthorized paths and record documented exceptions."],"actions_ar":["حصر تكاملات السجل الطبي وتصدير الملفات إلى الخارج.","فحص قواعد الوصول وموافقات الجهات الخارجية.","منع المسارات غير المصرح بها وتوثيق الاستثناءات."],"evidence":"Data-flow inventory, allowlists, integration approvals","evidence_ar":"جرد تدفقات البيانات وقوائم السماح وموافقات التكامل","why":"Uncontrolled exports increase exposure and complicate accountability.","why_ar":"يزيد التصدير غير المحكوم تسرب البيانات ويصعب المساءلة.","severity":"High","likelihood":"Medium","owner":"Privacy Officer","urgency":"1–2 weeks"},{"id":"DAT-04","domain":"DAT","student":2,"control":"MP-6 — Media Sanitization","nist_label":"NIST SP 800-53 Rev. 5 — MP-6 — Media Sanitization","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"","hhs_url":"","title":"Secure medical media disposal","title_ar":"الإتلاف الآمن لوسائط البيانات الطبية","question":"Are retired drives, imaging media and end-of-life devices sanitized with a documented chain of custody?","question_ar":"هل تُمحى بيانات الأقراص ووسائط التصوير والأجهزة المستغنى عنها مع توثيق سلسلة الحيازة؟","actions":["Inspect disposal policy and vendor certificates.","Sample retired storage devices for documented sanitization.","Secure unsanitized devices awaiting destruction."],"actions_ar":["مراجعة سياسة الإتلاف وشهادات المورد.","فحص عينات من الأجهزة المتقاعدة وسجلات محو البيانات.","تأمين الأجهزة غير الممحوة لحين إتلافها."],"evidence":"Sanitization certificates, asset disposal logs","evidence_ar":"شهادات محو البيانات وسجلات التخلص من الأصول","why":"Old hardware can expose patient histories even when no longer connected.","why_ar":"قد تكشف الأجهزة القديمة السجلات الطبية حتى بعد فصلها عن الشبكة.","severity":"Medium","likelihood":"Medium","owner":"Data Protection Lead","urgency":"1–3 months"},{"id":"MON-01","domain":"MON","student":3,"control":"AU-12 — Audit Record Generation","nist_label":"NIST SP 800-53 Rev. 5 — AU-12 — Audit Record Generation","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Centralized Log Collection","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Centralized clinical security logs","title_ar":"تجميع سجلات الأمن الطبية مركزيًا","question":"Do EHR, identity, VPN, firewall and critical server events reach a protected central logging platform?","question_ar":"هل تصل أحداث السجل الطبي والهوية والشبكة والخوادم الحرجة إلى منصة تسجيل مركزية محمية؟","actions":["Sample critical log sources against source onboarding list.","Confirm log time synchronization and access protection.","Connect missing high-risk sources and test event arrival."],"actions_ar":["مطابقة المصادر الحساسة مع قائمة مصادر السجلات المربوطة.","التحقق من توحيد الوقت وحماية الوصول إلى السجلات.","ربط المصادر الناقصة والتحقق من وصول الأحداث."],"evidence":"SIEM source list, test events, retention settings","evidence_ar":"قائمة مصادر SIEM وأحداث اختبار وإعدادات الاحتفاظ","why":"Blind spots delay detection of patient-record abuse and attacks.","why_ar":"تؤخر فجوات السجلات اكتشاف إساءة استخدام الملفات الطبية والهجمات.","severity":"High","likelihood":"Medium","owner":"SOC Manager","urgency":"1–2 weeks"},{"id":"MON-02","domain":"MON","student":3,"control":"AU-6 — Audit Record Review, Analysis, and Reporting","nist_label":"NIST SP 800-53 Rev. 5 — AU-6 — Audit Record Review, Analysis, and Reporting","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Centralized Log Collection","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Routine EHR audit log review","title_ar":"مراجعة دورية لسجلات الوصول الطبية","question":"Are suspicious record access, privilege changes and bulk exports reviewed with documented follow-up?","question_ar":"هل تُراجع عمليات الوصول المشبوهة وتغيير الصلاحيات والتصدير الكثيف مع توثيق المتابعة؟","actions":["Inspect review schedule and alert triage records.","Verify high-risk patient-chart access use cases.","Create cases for anomalous events and close with evidence."],"actions_ar":["فحص جدول المراجعة وسجلات فرز التنبيهات.","التحقق من سيناريوهات الوصول عالي الخطورة لملفات المرضى.","فتح حالات للأحداث الشاذة وإغلاقها بالأدلة."],"evidence":"Use-case catalog, triage cases, review signoffs","evidence_ar":"كتالوج سيناريوهات الرصد وحالات التنبيه واعتماد المراجعة","why":"Logs are ineffective if no one analyzes high-risk activity.","why_ar":"تفقد السجلات قيمتها إن لم تُحلَّل الأنشطة عالية الخطورة.","severity":"High","likelihood":"Medium","owner":"SOC Manager","urgency":"1–2 weeks"},{"id":"MON-03","domain":"MON","student":3,"control":"SI-4 — System Monitoring","nist_label":"NIST SP 800-53 Rev. 5 — SI-4 — System Monitoring","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Detect and Respond to Relevant Threats and Tactics, Techniques, and Procedures","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Endpoint threat detection coverage","title_ar":"تغطية رصد تهديدات الأجهزة","question":"Are endpoint detection controls active on compatible servers and workstations, with documented medical-device exceptions?","question_ar":"هل تعمل وسائل كشف التهديدات على الخوادم ومحطات العمل المتوافقة مع توثيق استثناءات الأجهزة الطبية؟","actions":["Compare endpoint sensor inventory with active asset inventory.","Investigate offline or unhealthy agents.","Apply alternative monitoring for unsupported clinical devices."],"actions_ar":["مقارنة جرد حساسات الرصد بجرد الأصول الفعلي.","التحقق من الحساسات المتوقفة أو غير السليمة.","تطبيق مراقبة بديلة للأجهزة الطبية غير المدعومة."],"evidence":"EDR console coverage, exception records, alert test","evidence_ar":"تقرير تغطية EDR وسجلات الاستثناء واختبار التنبيه","why":"Ransomware can evade visibility on unmonitored endpoints.","why_ar":"قد تنتشر برمجيات الفدية عبر أجهزة لا تخضع للمراقبة.","severity":"High","likelihood":"High","owner":"SOC Manager","urgency":"Immediate"},{"id":"MON-04","domain":"MON","student":3,"control":"SI-5 — Security Alerts, Advisories, and Directives","nist_label":"NIST SP 800-53 Rev. 5 — SI-5 — Security Alerts, Advisories, and Directives","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Mitigate Known Vulnerabilities","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Threat advisory intake and escalation","title_ar":"استقبال التحذيرات الأمنية وتصعيدها","question":"Does the security team evaluate relevant vulnerability advisories and communicate urgent actions to system owners?","question_ar":"هل يقيم فريق الأمن التحذيرات المتعلقة بالثغرات ويوصل الإجراءات العاجلة إلى مسؤولي الأنظمة؟","actions":["Review advisory subscriptions and intake log.","Trace a recent relevant alert through triage and ownership.","Track due dates for urgent mitigation decisions."],"actions_ar":["مراجعة مصادر التنبيهات وسجل استقبالها.","تتبع تحذير حديث من الفرز إلى تعيين المسؤول.","متابعة مواعيد قرارات التخفيف العاجل."],"evidence":"Advisory queue, threat intelligence, escalation ticket","evidence_ar":"قائمة التحذيرات ومعلومات التهديدات وطلبات التصعيد","why":"Actionable intelligence helps reduce exposure before exploitation.","why_ar":"تساعد المعلومات الأمنية العملية في تقليل التعرض قبل الاستغلال.","severity":"Medium","likelihood":"Medium","owner":"Threat Intelligence Lead","urgency":"1–3 months"},{"id":"INC-01","domain":"INC","student":3,"control":"IR-8 — Incident Response Plan","nist_label":"NIST SP 800-53 Rev. 5 — IR-8 — Incident Response Plan","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Basic Incident Planning and Preparedness","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Healthcare incident response plan","title_ar":"خطة الاستجابة للحوادث في المستشفى","question":"Is a current incident plan approved, with roles, decision authority and patient-safety escalation paths?","question_ar":"هل توجد خطة استجابة حديثة معتمدة تحدد الأدوار وصلاحيات القرار ومسار تصعيد سلامة المرضى؟","actions":["Review plan approval, contacts and severity criteria.","Check coordination with clinical operations, legal and communications.","Update owner, escalation matrix and incident playbooks."],"actions_ar":["مراجعة اعتماد الخطة وبيانات الاتصال ومعايير الخطورة.","التحقق من التنسيق مع الفرق الطبية والقانونية والإعلام.","تحديث المسؤولين ومسارات التصعيد وسيناريوهات الاستجابة."],"evidence":"Signed incident plan, contacts, playbook versions","evidence_ar":"خطة الحوادث المعتمدة وجهات الاتصال وإصدارات الإجراءات","why":"Unclear authority slows response during a patient-impacting attack.","why_ar":"يؤخر غياب الأدوار الواضحة الاستجابة للهجمات التي تؤثر في المرضى.","severity":"High","likelihood":"Medium","owner":"Incident Response Manager","urgency":"1–2 weeks"},{"id":"INC-02","domain":"INC","student":3,"control":"IR-4 — Incident Handling","nist_label":"NIST SP 800-53 Rev. 5 — IR-4 — Incident Handling","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Basic Incident Planning and Preparedness","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Ransomware containment playbook","title_ar":"سيناريو احتواء برمجيات الفدية","question":"Can teams rapidly isolate compromised systems while maintaining essential medical care?","question_ar":"هل تستطيع الفرق عزل الأنظمة المصابة بسرعة مع استمرار الرعاية الطبية الأساسية؟","actions":["Walk through ransomware triage, isolate and escalation steps.","Validate pre-approved clinical downtime procedures.","Close gaps in technical and clinical decision points."],"actions_ar":["مراجعة خطوات فحص وعزل وتصعيد هجوم الفدية.","التحقق من إجراءات العمل اليدوي الطبي المعتمدة.","معالجة فجوات القرار بين الفريق التقني والطبي."],"evidence":"Ransomware playbook, isolation procedures, downtime checklist","evidence_ar":"إجراءات الفدية والعزل وقائمة العمل أثناء التعطل","why":"Containment must protect both system integrity and continuity of care.","why_ar":"يجب أن يحمي الاحتواء سلامة الأنظمة واستمرارية علاج المرضى.","severity":"High","likelihood":"High","owner":"Incident Response Manager","urgency":"Immediate"},{"id":"INC-03","domain":"INC","student":3,"control":"IR-3 — Incident Response Testing","nist_label":"NIST SP 800-53 Rev. 5 — IR-3 — Incident Response Testing","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Basic Incident Planning and Preparedness","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Incident tabletop exercises","title_ar":"تمارين محاكاة للحوادث الأمنية","question":"Have hospital leadership, IT and clinical teams exercised the response plan and tracked lessons learned?","question_ar":"هل شاركت الإدارة وتقنية المعلومات والفرق الطبية في محاكاة الخطة مع متابعة الدروس المستفادة؟","actions":["Inspect exercise schedule, participants and scenarios.","Review gaps identified in the last tabletop and ownership.","Schedule a cross-functional exercise and track fixes."],"actions_ar":["فحص جدول التمارين والمشاركين والسيناريوهات.","مراجعة نقاط الضعف في آخر تمرين ومسؤوليها.","جدولة تمرين مشترك ومتابعة المعالجة."],"evidence":"Exercise report, attendance, action tracker","evidence_ar":"تقرير التمرين والحضور وسجل الإجراءات","why":"Untested procedures can fail under the pressure of a real emergency.","why_ar":"قد تفشل الإجراءات غير المختبرة أثناء الطوارئ الفعلية.","severity":"Medium","likelihood":"Medium","owner":"Incident Response Manager","urgency":"1–3 months"},{"id":"INC-04","domain":"INC","student":3,"control":"IR-6 — Incident Reporting","nist_label":"NIST SP 800-53 Rev. 5 — IR-6 — Incident Reporting","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Basic Incident Planning and Preparedness","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Incident notification and reporting","title_ar":"الإبلاغ عن الحوادث وإخطار الجهات","question":"Are internal and applicable external reporting triggers, recipients and deadlines documented and rehearsed?","question_ar":"هل تُوثق وتُختبر محفزات الإبلاغ الداخلي والخارجي والجهات المستلمة والمواعيد المطلوبة؟","actions":["Map reportable incident types and responsible approvers.","Check applicable regional legal notification obligations separately.","Test escalation from SOC to privacy, legal and leadership."],"actions_ar":["تحديد أنواع الحوادث الواجب الإبلاغ عنها والمعتمدين.","التحقق منفصلًا من الالتزامات القانونية حسب الدولة.","اختبار التصعيد من مركز العمليات إلى الخصوصية والشؤون القانونية والإدارة."],"evidence":"Notification matrix, legal register, escalation records","evidence_ar":"مصفوفة الإخطار والسجل القانوني ومحاضر التصعيد","why":"Missed notifications can increase organizational and patient harm.","why_ar":"قد يزيد التأخر في الإبلاغ الأضرار التنظيمية وعلى المرضى.","severity":"High","likelihood":"Medium","owner":"Privacy & Legal Lead","urgency":"1–2 weeks"},{"id":"BCP-01","domain":"BCP","student":4,"control":"CP-2 — Contingency Plan","nist_label":"NIST SP 800-53 Rev. 5 — CP-2 — Contingency Plan","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Basic Incident Planning and Preparedness","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Clinical continuity during EHR outage","title_ar":"استمرار الرعاية أثناء تعطل السجل الطبي","question":"Does the hospital have approved downtime workflows for medication, laboratory and emergency care?","question_ar":"هل لدى المستشفى إجراءات عمل بديلة معتمدة للأدوية والمختبرات والطوارئ عند تعطل السجل الطبي؟","actions":["Review prioritized clinical services and manual fallbacks.","Check RTO/RPO assumptions with clinical owners.","Update plans where patient-care dependencies are missing."],"actions_ar":["مراجعة الخدمات الطبية الحرجة والإجراءات اليدوية البديلة.","التحقق من أهداف زمن ونقطة الاستعادة مع مسؤولي العلاج.","تحديث الخطط لاعتماديات رعاية المرضى غير المشمولة."],"evidence":"Continuity plan, downtime forms, clinical approvals","evidence_ar":"خطة الاستمرارية ونماذج العمل اليدوي والموافقات الطبية","why":"Critical care must continue if digital systems become unavailable.","why_ar":"يجب استمرار الرعاية الحرجة عند توقف الأنظمة الرقمية.","severity":"High","likelihood":"High","owner":"BCP Manager","urgency":"Immediate"},{"id":"BCP-02","domain":"BCP","student":4,"control":"CP-9 — System Backup","nist_label":"NIST SP 800-53 Rev. 5 — CP-9 — System Backup","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Basic Incident Planning and Preparedness","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Protected EHR backups","title_ar":"نسخ احتياطية محمية للسجل الطبي","question":"Are critical medical-data backups isolated or protected against tampering, with monitored success and retention?","question_ar":"هل تُعزل النسخ الاحتياطية لبيانات المرضى أو تُحمى من التلاعب مع مراقبة نجاح النسخ وفترات الاحتفاظ؟","actions":["Review backup schedules, success alerts and offsite/immutable protection.","Sample EHR, PACS and key configuration backup scope.","Correct failures and restrict backup administrator access."],"actions_ar":["مراجعة الجداول والتنبيهات والحماية الخارجية أو غير القابلة للتغيير.","فحص شمول نسخ السجل الطبي والصور الطبية والإعدادات الحرجة.","إصلاح الأعطال وتقييد صلاحيات مسؤولي النسخ."],"evidence":"Backup job history, immutability settings, backup scope","evidence_ar":"سجل مهام النسخ وإعدادات عدم التعديل ونطاق النسخ","why":"Unprotected backups may be destroyed by ransomware.","why_ar":"قد تدمر هجمات الفدية النسخ الاحتياطية غير المحمية.","severity":"High","likelihood":"High","owner":"Backup Administrator","urgency":"Immediate"},{"id":"BCP-03","domain":"BCP","student":4,"control":"CP-10 — System Recovery and Reconstitution","nist_label":"NIST SP 800-53 Rev. 5 — CP-10 — System Recovery and Reconstitution","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Basic Incident Planning and Preparedness","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Tested clinical recovery procedures","title_ar":"اختبار استعادة الأنظمة الطبية","question":"Have the organization restored critical systems from backups and confirmed recovery integrity in a recent controlled test?","question_ar":"هل أعادت المؤسسة تشغيل الأنظمة الحرجة من نسخ احتياطية وتحققت من سلامة الاستعادة في اختبار مراقب حديث؟","actions":["Inspect recovery test results and actual RTO/RPO.","Validate restored EHR data with clinical data owners.","Resolve failed restores and repeat the test safely."],"actions_ar":["فحص نتائج اختبارات الاستعادة وأزمنة الاستعادة الفعلية.","التحقق من سلامة بيانات السجل الطبي مع المالكين الطبيين.","معالجة اختبارات الاستعادة الفاشلة وإعادتها بأمان."],"evidence":"Restore test report, RTO/RPO results, validation approval","evidence_ar":"تقرير تجربة الاستعادة ومؤشرات الزمن وموافقات التحقق","why":"A successful backup is not useful without a verified restore.","why_ar":"لا قيمة للنسخة الاحتياطية دون استعادة ناجحة تم التحقق منها.","severity":"High","likelihood":"High","owner":"Disaster Recovery Manager","urgency":"Immediate"},{"id":"BCP-04","domain":"BCP","student":4,"control":"CP-4 — Contingency Plan Testing","nist_label":"NIST SP 800-53 Rev. 5 — CP-4 — Contingency Plan Testing","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Basic Incident Planning and Preparedness","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"End-to-end downtime drills","title_ar":"تدريبات التعطل الشامل","question":"Are business continuity plans exercised across clinical departments and improvement actions tracked to closure?","question_ar":"هل تُختبر خطط الاستمرارية بين الأقسام الطبية مع متابعة إجراءات التحسين حتى الإغلاق؟","actions":["Review last drill findings and involvement of clinical departments.","Verify lessons learned have owners and due dates.","Schedule next coordinated downtime exercise."],"actions_ar":["مراجعة نتائج أحدث تدريب ومشاركة الأقسام الطبية.","التحقق من تعيين المسؤول والموعد لكل درس مستفاد.","جدولة التدريب القادم على تعطل الأنظمة."],"evidence":"Drill report, corrective action register, exercise plan","evidence_ar":"تقرير التدريب وسجل إجراءات التحسين وخطة الاختبارات","why":"Rehearsal reveals dependencies missed in written plans.","why_ar":"تكشف التدريبات اعتماديات لا تظهر في الخطط المكتوبة.","severity":"Medium","likelihood":"Medium","owner":"BCP Manager","urgency":"1–3 months"},{"id":"VEN-01","domain":"VEN","student":4,"control":"SR-3 — Supply Chain Controls and Processes","nist_label":"NIST SP 800-53 Rev. 5 — SR-3 — Supply Chain Controls and Processes","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Vendor/Supplier Cybersecurity Requirements","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Risk-based supplier security requirements","title_ar":"متطلبات أمن الموردين حسب المخاطر","question":"Are security requirements established before onboarding healthcare software, cloud and medical-device vendors?","question_ar":"هل تُحدد متطلبات الأمن قبل التعاقد مع موردي البرامج والخدمات السحابية والأجهزة الطبية؟","actions":["Inspect procurement security gates for critical suppliers.","Add data protection, incident notification and access clauses.","Record approval or treatment of exceptions."],"actions_ar":["فحص خطوات الاعتماد الأمني في شراء الخدمات الحرجة.","إضافة بنود حماية البيانات والإبلاغ عن الحوادث والوصول.","تسجيل الموافقات والاستثناءات وإجراءاتها."],"evidence":"Procurement template, contracts, supplier risk tiers","evidence_ar":"نموذج المشتريات والعقود وتصنيف مخاطر الموردين","why":"Supplier weaknesses can affect patient data and hospital availability.","why_ar":"قد تؤثر ثغرات الموردين على بيانات المرضى وتوافر خدمات المستشفى.","severity":"High","likelihood":"Medium","owner":"Third-Party Risk Manager","urgency":"1–2 weeks"},{"id":"VEN-02","domain":"VEN","student":4,"control":"SA-9 — External System Services","nist_label":"NIST SP 800-53 Rev. 5 — SA-9 — External System Services","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Vendor/Supplier Cybersecurity Requirements","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Oversight of cloud-hosted patient services","title_ar":"الإشراف على خدمات المرضى السحابية","question":"Are externally hosted patient portals and cloud services monitored against documented security responsibilities and service terms?","question_ar":"هل تتم مراقبة بوابات المرضى والخدمات السحابية وفق مسؤوليات أمنية وشروط خدمة موثقة؟","actions":["Review service agreements and shared-responsibility matrices.","Request assurance evidence and security incident contacts.","Assign internal owner for ongoing supplier performance review."],"actions_ar":["مراجعة اتفاقيات الخدمات ومصفوفة المسؤولية المشتركة.","طلب أدلة الضمان الأمني وبيانات اتصال الحوادث.","تعيين مسؤول داخلي لمراجعة أداء المورد دوريًا."],"evidence":"Service contracts, assurance reports, SLA monitoring","evidence_ar":"عقود الخدمة وتقارير التأكيد ومراقبة مستوى الخدمة","why":"Outsourcing operations does not outsource accountability for patient services.","why_ar":"لا يعفي إسناد التشغيل للخارج المستشفى من المسؤولية عن خدمات المرضى.","severity":"High","likelihood":"Medium","owner":"Cloud Service Owner","urgency":"1–2 weeks"},{"id":"VEN-03","domain":"VEN","student":4,"control":"SR-6 — Supplier Assessments and Reviews","nist_label":"NIST SP 800-53 Rev. 5 — SR-6 — Supplier Assessments and Reviews","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Third Party Vulnerability Disclosure","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Periodic critical vendor reviews","title_ar":"مراجعات دورية للموردين الحرجين","question":"Are critical suppliers periodically reassessed for vulnerabilities, assurance and changes to their security posture?","question_ar":"هل يُعاد تقييم الموردين الحرجين دوريًا بشأن الثغرات والضمانات والتغيرات الأمنية؟","actions":["Rank suppliers by clinical and data sensitivity.","Review updated assessments, independent reports and open findings.","Assign remediation deadlines and escalation for deficient suppliers."],"actions_ar":["تصنيف الموردين حسب تأثيرهم الطبي وحساسية البيانات.","مراجعة التقييمات وتقارير الضمان والملاحظات المفتوحة.","تحديد مواعيد المعالجة والتصعيد للموردين غير الملتزمين."],"evidence":"Supplier assessments, review calendar, issue tracker","evidence_ar":"تقييمات الموردين وجدول المراجعات وسجل المشكلات","why":"Supplier risk changes after contract signature and needs regular oversight.","why_ar":"تتغير مخاطر المورد بعد التعاقد ويجب متابعتها بانتظام.","severity":"Medium","likelihood":"Medium","owner":"Third-Party Risk Manager","urgency":"1–3 months"},{"id":"VEN-04","domain":"VEN","student":4,"control":"RA-3 — Risk Assessment","nist_label":"NIST SP 800-53 Rev. 5 — RA-3 — Risk Assessment","nist_url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","hhs_goal":"Vendor/Supplier Cybersecurity Requirements","hhs_url":"https://hhscyber.hhs.gov/cybersecurity-performance-goals.html","title":"Formal patient-safety risk register","title_ar":"سجل مخاطر أمنية يؤثر على سلامة المرضى","question":"Are cyber risks to patient safety, confidentiality and service availability identified, scored and assigned accountable owners?","question_ar":"هل تُحدد مخاطر الأمن على سلامة المرضى وسرية البيانات وتوافر الخدمات وتُقيّم ويُعيّن مسؤول لكل منها؟","actions":["Review recent risk assessment methodology and register.","Check whether clinical impact and vendor dependencies are considered.","Assign treatment decisions, owners and review dates to major risks."],"actions_ar":["مراجعة منهج تقييم المخاطر والسجل الحديث.","التحقق من مراعاة الأثر الطبي واعتماديات الموردين.","تعيين قرارات المعالجة والمسؤولين ومواعيد مراجعة المخاطر الكبرى."],"evidence":"Risk register, assessment criteria, management sign-off","evidence_ar":"سجل المخاطر ومعايير التقييم واعتماد الإدارة","why":"Leadership cannot prioritize security investment without documented business and clinical impacts.","why_ar":"لا تستطيع الإدارة ترتيب الإنفاق الأمني دون توثيق الأثر التشغيلي والطبي.","severity":"High","likelihood":"Medium","owner":"CISO / Risk Manager","urgency":"1–2 weeks"}]</script>
<script>
'use strict';
const ITEMS=JSON.parse(document.getElementById('data').textContent);
const DOMAINS=[['IAM','Identity & Access Management','إدارة الهوية والتحكم في الوصول'],['NET','Network & Infrastructure','أمن الشبكات والبنية التحتية'],['AST','Assets & Vulnerabilities','الأصول والثغرات الأمنية'],['DAT','Data Protection & Privacy','حماية البيانات والخصوصية'],['MON','Monitoring & Detection','المراقبة واكتشاف التهديدات'],['INC','Incident Response','الاستجابة للحوادث الأمنية'],['BCP','Continuity & Recovery','استمرارية الأعمال والتعافي'],['VEN','Vendor Risk & Governance','مخاطر الموردين والحوكمة']];
const NAV=[['overview','▦','Overview','نظرة عامة'],['checklist','☷','Live checklist','قائمة التدقيق'],['roadmap','≋','Remediation roadmap','خطة المعالجة'],['method','◇','Standards & scoring','المعايير والتقييم'],['team','♙','Team & presentation','الفريق والعرض']];
const TRAN={overview:['Overview','نظرة عامة'],checklist:['Live audit checklist','قائمة التدقيق المباشرة'],roadmap:['Prioritized remediation roadmap','خطة المعالجة حسب الأولوية'],method:['Standards & methodology','المعايير والمنهجية'],team:['Team & grading plan','الفريق وخطة التقييم'], lang:['العربية','English'],save:['↓ Save session','↓ حفظ الجلسة'],load:['↑ Load session','↑ تحميل الجلسة'],demo:['Load demo','تجربة توضيحية'],reset:['Reset all','إعادة تعيين'], total:['Total controls','إجمالي الضوابط'],verified:['Compliant','مستوفٍ'],partial:['Partially met','مستوفٍ جزئيًا'],open:['Not met','غير مستوفٍ'],pending:['Not assessed','لم يتم التقييم'],na:['Not applicable','غير منطبق'],assessed:['Assessed controls','ضوابط تم تقييمها'],openrisk:['Open findings','الملاحظات المفتوحة'],score:['Risk score','درجة المخاطر'],search:['Search questions or control IDs','البحث في الأسئلة أو رموز الضوابط'],status:['Status','الحالة'],domain:['Domain','المجال'],student:['Team member','عضو الفريق'],hide:['Hide completed controls','إخفاء الضوابط المستوفاة'],question:['Audit question','سؤال التدقيق'],impact:['Severity / impact','الشدة / الأثر'],likelihood:['Likelihood','الاحتمالية'],owner:['Accountable owner','المسؤول عن التنفيذ'],evidence:['Evidence / interview notes (no patient identifiers)','الأدلة / ملاحظات المقابلة (دون معرفات مرضى)'],due:['Target due date (optional)','الموعد المستهدف (اختياري)'],detail:['Actions, evidence & source references','الإجراءات والأدلة والمراجع'],actions:['Associated verification / remediation actions','إجراءات التحقق والمعالجة'],sample:['Suggested evidence to request','أدلة مقترحة لطلبها'],why:['Risk justification','مبرر الخطورة'],baseline:['Baseline remediation urgency','الاستعجال المبدئي للمعالجة'],refs:['Exact control / standard source','مرجع الضابط / المعيار'],sourced:['Use browser Find for the cited control ID or HHS goal name. These are authoritative source pages; never invent standard text.','استخدم البحث في المتصفح عن رمز الضابط أو اسم هدف HHS. الروابط لمصادر رسمية؛ لا تختلق نصًا من المعيار.'],download:['Export open actions CSV','تصدير إجراءات المعالجة CSV'],print:['Print / Save PDF','طباعة / حفظ PDF'],gap:['Unresolved security gaps','الفجوات الأمنية غير المعالجة'], priority:['Priority','الأولوية'],actionleft:['Unresolved actions','الإجراءات غير المنجزة'],choose:['All domains','كل المجالات'],all:['All statuses','كل الحالات'],allmembers:['All members','كل الأعضاء'],immediate:['Immediate','فوري'],weeks:['1–2 weeks','خلال أسبوع إلى أسبوعين'],months:['1–3 months','خلال شهر إلى ثلاثة أشهر'],high:['High','مرتفع'],medium:['Medium','متوسط'],low:['Low','منخفض'],noresults:['No controls match these filters.','لا توجد ضوابط مطابقة لهذه التصفية.'], noblind:['Do not treat unanswered controls as proven vulnerabilities.','لا تُعتبر الضوابط التي لم يتم تقييمها ثغرات مثبتة.'], session:['Browser-local demonstration data only. Export session JSON to preserve or move your work.','بيانات تجريبية محفوظة محليًا في المتصفح. صدّر ملف JSON لحفظ الجلسة.']};
let lang='en',page='overview',filters={q:'',d:'all',s:'all',m:'all',hide:false};
const EMPTY=()=>Object.fromEntries(ITEMS.map(x=>[x.id,{status:'pending',like:x.likelihood,owner:x.owner,notes:'',date:'',checks:[]} ]));
let responses=EMPTY(),demo=false;
try{const raw=JSON.parse(localStorage.getItem('medsecure-audit-v3')||'null');if(raw&&typeof raw==='object'&&raw.responses){for(const x of ITEMS){const r=raw.responses[x.id];if(r&&typeof r==='object')responses[x.id]={...responses[x.id],...r};}demo=!!raw.demo;lang=raw.lang==='ar'?'ar':'en';}}catch(e){console.warn('Session could not be loaded:',e)}
const L=(en,ar)=>lang==='ar'?ar:en;
const T=k=>(TRAN[k]||[k,k])[lang==='ar'?1:0];
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sel=(v,a)=>v===a?'selected':'';
const statusText=s=>({pending:T('pending'),compliant:T('verified'),partial:T('partial'),noncompliant:T('open'),na:T('na')})[s]||T('pending');
const risk=n=>n==='High'?3:n==='Medium'?2:1;
const score=x=>{let r=responses[x.id];return +(risk(x.severity)*risk(r.like)*(r.status==='partial'?.7:1)).toFixed(1)};
const urgency=x=>{const s=score(x);return s>=7?'Immediate':s>=4?'1–2 weeks':'1–3 months'};
const urgencyText=u=>u==='Immediate'?T('immediate'):u==='1–2 weeks'?T('weeks'):T('months');
const isGap=x=>['noncompliant','partial'].includes(responses[x.id].status);
const counts=()=>{const c={pending:0,compliant:0,partial:0,noncompliant:0,na:0};ITEMS.forEach(x=>c[responses[x.id].status]=(c[responses[x.id].status]||0)+1);return c};
const audited=()=>ITEMS.length-counts().pending;
function persist(){try{localStorage.setItem('medsecure-audit-v3',JSON.stringify({responses,demo,lang}));}catch(e){toast(L('Local saving unavailable; export JSON before closing.','التخزين المحلي غير متاح؛ صدّر ملف JSON.'))}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.remove('show'),3100)}
function anchor(x,txt){return `<a target="_blank" rel="noopener noreferrer" href="${E(x)}">${E(txt)} ↗</a>`}
function navTo(n){page=n;render();window.scrollTo({top:0,behavior:'auto'})}
function head(eyebrow,title,subtitle,tools=''){return `<div class="pagehead"><div><p class="eyebrow">${E(eyebrow)}</p><h1>${E(title)}</h1><p class="sub">${E(subtitle)}</p></div>${tools}</div>`}
function topRefresh(){let c=counts();document.getElementById('sideprogress').textContent=`${audited()} / 32`;document.getElementById('sideprogressbar').style.width=`${100*audited()/32}%`;document.getElementById('sidecaption').textContent=L('AUDIT COVERAGE','تغطية التدقيق');document.getElementById('sidenote').textContent=L('Fictional hospital. Never enter real patient data.','مستشفى افتراضي. لا تدخل بيانات مرضى حقيقيين.');document.getElementById('demo-banner').innerHTML=demo?`<div class="banner">${L('DEMO SCENARIO — simulated client answers, not verified findings. Reset before the real TA interview.','وضع التجربة — إجابات افتراضية وليست نتائج مثبتة. أعد التعيين قبل مقابلة المعيد.')}</div>`:'';document.getElementById('crumb').textContent=T(page);}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.documentElement.classList.toggle('ar',lang==='ar');document.title='MedSecure | '+T(page);document.getElementById('lang').textContent=T('lang');document.getElementById('export-json').textContent=T('save');document.getElementById('import-json').textContent=T('load');document.getElementById('demo').textContent=T('demo');document.getElementById('reset-all').textContent=T('reset');document.getElementById('nav').innerHTML=NAV.map(n=>`<button class="${n[0]===page?'active':''}" data-nav="${n[0]}" type="button" aria-current="${n[0]===page?'page':'false'}"><span class="glyph">${n[1]}</span><span class="navtext">${E(L(n[2],n[3]))}</span></button>`).join('');topRefresh();document.getElementById('main').innerHTML=page==='overview'?overview():page==='checklist'?checklist():page==='roadmap'?roadmap():page==='method'?method():team();}
function overview(){let c=counts(),g=ITEMS.filter(isGap),pct=Math.round(100*audited()/32);return `<div class="hero"><p class="eyebrow" style="color:#82dcd9">BINF 711 · CYBERSECURITY AUDIT PROJECT</p><h1>${L('Healthcare Cybersecurity Audit Command Center','مركز إدارة تدقيق الأمن السيبراني الصحي')}</h1><p>${L('MedSecure Global Hospitals · fictional international healthcare network · live client interview & risk-prioritized action tracking.','مستشفيات MedSecure العالمية · شبكة رعاية صحية افتراضية · مقابلة عميل مباشرة وتتبع إجراءات المعالجة حسب المخاطر.')}</p><button class="btn primary" data-nav="checklist">${L('Start / continue audit →','بدء / متابعة التدقيق ←')}</button></div>
<div class="stats grid">${[[T('total'),32,'8 domains'],[T('verified'),c.compliant,'Confirmed'],[T('partial'),c.partial,'Open action'],[T('open'),c.noncompliant,'Open action'],[T('pending'),c.pending,'Needs interview']].map(([a,b,c])=>`<div class="stat"><small>${E(a)}</small><strong>${b}</strong><span>${E(c)}</span></div>`).join('')}</div>
<div class="two-col"><div class="panel"><div class="sectionline"><h2>${L('Audit coverage by domain','تغطية التدقيق حسب المجال')}</h2><span class="tag blue">${pct}% ${L('assessed','مُقيَّم')}</span></div><div class="domain-grid">${DOMAINS.map(d=>{let sub=ITEMS.filter(x=>x.domain===d[0]),done=sub.filter(x=>responses[x.id].status!=='pending').length;return `<button type="button" class="domainbox" data-goto-domain="${d[0]}"><h3>${E(L(d[1],d[2]))}<small>${done}/4</small></h3><div class="progressouter"><div class="progressinner" style="width:${done*25}%"></div></div><footer><span>${L('Member','عضو')} ${sub[0].student}</span><span>${done===4?L('Reviewed','تمت المراجعة'):L('Needs review','يحتاج مراجعة')}</span></footer></button>`}).join('')}</div></div>
<div class="panel"><div class="sectionline"><h2>${L('Assessment snapshot','ملخص نتائج التقييم')}</h2></div><div style="font-size:32px;font-weight:850;color:#157f90;margin:0 0 3px">${pct}%</div><div class="progressouter" style="margin:8px 0 20px"><div class="progressinner" style="width:${pct}%"></div></div><p class="minihead">${T('openrisk')}: ${g.length}</p><p class="muted" style="font-size:12px">${L('Only client-confirmed partial and unmet controls appear as gaps. Unanswered items are not counted as findings.','تظهر الضوابط غير المستوفاة أو المستوفاة جزئيًا بعد تأكيد العميل فقط. لا تُحتسب العناصر غير المُقيَّمة كفجوات.')}</p><div style="margin:20px 0 9px"><button class="btn dark" data-nav="roadmap">${L('View live action roadmap →','عرض خطة المعالجة المباشرة ←')}</button></div><p class="help-note">${T('session')}</p></div></div>`}
function checklist(){let c=counts();let filtered=ITEMS.filter(x=>{let r=responses[x.id];const query=filters.q.trim().toLowerCase();return (!query||[x.id,x.title,x.title_ar,x.question,x.question_ar,x.control].some(z=>String(z).toLowerCase().includes(query)))&&(filters.d==='all'||filters.d===x.domain)&&(filters.s==='all'||filters.s===r.status)&&(filters.m==='all'||+filters.m===x.student)&&(!filters.hide||r.status!=='compliant')});return head('LIVE AUDIT WORKSPACE',T('checklist'),L('Ask the client, request evidence, record findings, and mark a control compliant only when verified.','اسأل العميل واطلب الأدلة وسجل النتائج، ولا تعتمد الضابط كمستوفٍ إلا بعد التحقق.'),`<div class="legend"><span class="tag complete">${c.compliant} ${T('verified')}</span><span class="tag open">${c.noncompliant+c.partial} ${T('openrisk')}</span></div>`)+`<div class="panel" style="padding:17px"><div class="filters"><input class="field" id="search" placeholder="${T('search')}" aria-label="${T('search')}" value="${E(filters.q)}"><select class="field" id="filter-domain" aria-label="${T('domain')}"><option value="all">${T('choose')}</option>${DOMAINS.map(d=>`<option value="${d[0]}" ${sel(filters.d,d[0])}>${E(L(d[1],d[2]))}</option>`).join('')}</select><select class="field" id="filter-status" aria-label="${T('status')}"><option value="all">${T('all')}</option>${['pending','compliant','partial','noncompliant','na'].map(x=>`<option value="${x}" ${sel(filters.s,x)}>${statusText(x)}</option>`).join('')}</select><select class="field" id="filter-member" aria-label="${T('student')}"><option value="all">${T('allmembers')}</option>${[1,2,3,4].map(i=>`<option value="${i}" ${sel(filters.m,String(i))}>${L('Member','العضو')} ${i} (8)</option>`).join('')}</select></div><div class="checksbar"><label><input id="hide-completed" type="checkbox" ${filters.hide?'checked':''}> ${T('hide')}</label><span class="smallmuted">${filtered.length} / 32 ${L('controls displayed','ضابطًا معروضًا')}</span></div></div>`+(filtered.length?DOMAINS.map((d,di)=>{let sub=filtered.filter(x=>x.domain===d[0]);return sub.length?`<section class="domain-section"><div class="domaintop"><div class="domainnum">${di+1}</div><div><h2>${E(L(d[1],d[2]))}</h2><div class="domainmeta">${L('Member','عضو')} ${ITEMS.find(x=>x.domain===d[0]).student} · ${sub.length} ${L('questions','أسئلة')}</div></div></div>${sub.map(card).join('')}</section>`:''}).join(''):`<div class="panel empty"><b>${T('noresults')}</b></div>`)}
function card(x){let r=responses[x.id];let st=r.status;return `<article class="auditcard status-${st}" id="card-${x.id}"><div class="cardtop"><div><span class="idnum">${x.id} · ${E(x.control.split(' — ')[0])}</span><h3>${E(L(x.title,x.title_ar))}</h3></div><div class="chips"><span class="tag ${x.severity.toLowerCase()}">${T(x.severity.toLowerCase())}</span><span class="tag ${st==='compliant'?'complete':st==='noncompliant'?'open':st==='pending'?'pending':st}">${statusText(st)}</span></div></div><p class="question">${E(L(x.question,x.question_ar))}</p>
<div class="controls-row"><div class="fgroup"><label for="status-${x.id}">${T('status')}</label><select class="field" id="status-${x.id}" data-field="status" data-id="${x.id}">${['pending','compliant','partial','noncompliant','na'].map(o=>`<option value="${o}" ${sel(st,o)}>${statusText(o)}</option>`).join('')}</select></div><div class="fgroup"><label for="like-${x.id}">${T('likelihood')}</label><select class="field" id="like-${x.id}" data-field="like" data-id="${x.id}">${['High','Medium','Low'].map(o=>`<option value="${o}" ${sel(r.like,o)}>${T(o.toLowerCase())}</option>`).join('')}</select></div><div class="fgroup"><label for="own-${x.id}">${T('owner')}</label><input class="field" id="own-${x.id}" value="${E(r.owner)}" data-field="owner" data-id="${x.id}"></div></div>
<details class="auditdetails"><summary>${T('detail')}</summary><div class="detailcols"><section><h4>${T('actions')}</h4>${x.actions.map((a,i)=>`<label class="action-row ${(r.checks||[]).includes(i)?'done':''}"><input type="checkbox" data-check="${i}" data-id="${x.id}" ${(r.checks||[]).includes(i)?'checked':''}><span>${E(L(a,x.actions_ar[i]))}</span></label>`).join('')}<p class="help-note">${L('Checking an action does not automatically close the finding; client evidence is still required.','تحديد إجراء لا يغلق الملاحظة تلقائيًا؛ يلزم تأكيد الأدلة من العميل.')}</p></section><section><h4>${T('sample')}</h4><p>${E(L(x.evidence,x.evidence_ar))}</p><h4 style="margin-top:16px">${T('why')}</h4><p>${E(L(x.why,x.why_ar))}</p><h4 style="margin-top:16px">${T('baseline')}</h4><p>${urgencyText(x.urgency)} · ${T('impact')}: ${T(x.severity.toLowerCase())}</p><h4 style="margin-top:16px">${T('refs')}</h4><p>${E(x.nist_label)}</p><div class="refs">${anchor(x.nist_url,L('NIST official catalog','موقع NIST الرسمي'))}${x.hhs_goal?anchor(x.hhs_url,'HHS: '+x.hhs_goal):''}</div><p class="help-note">${T('sourced')}</p></section></div><div class="note-grid"><div class="fgroup"><label for="note-${x.id}">${T('evidence')}</label><textarea id="note-${x.id}" class="field" data-field="notes" data-id="${x.id}" placeholder="${L('Record exactly what the client confirmed and what evidence remains missing.','سجل ما أكده العميل وما لا يزال يحتاج دليلًا.')}">${E(r.notes)}</textarea></div><div class="fgroup"><label for="date-${x.id}">${T('due')}</label><input id="date-${x.id}" class="field" type="date" data-field="date" data-id="${x.id}" value="${E(r.date)}"><p class="help-note">${L('Suggested evidence and urgency are consultant recommendations, not proof of compliance.','الأدلة والمواعيد المقترحة توصيات استشارية وليست دليلًا على الامتثال.')}</p></div></div></details></article>`}
function roadmap(){let gaps=ITEMS.filter(isGap).sort((a,b)=>score(b)-score(a)||a.id.localeCompare(b.id));let openActions=gaps.reduce((n,x)=>n+x.actions.length-(responses[x.id].checks||[]).length,0);return head('DECISION-READY DELIVERABLE',T('roadmap'),L('Client-confirmed unresolved controls, ordered by consultant-defined priority. Download the action tracker or print a report.','الضوابط التي أكد العميل وجود قصور فيها مرتبة بحسب الأولوية. يمكنك تصدير الإجراءات أو طباعة التقرير.'),`<div class="topactions"><button class="btn primary" id="export-csv">${T('download')}</button><button class="btn" id="print-report">${T('print')}</button></div>`)+`<div class="stats grid" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><small>${T('gap')}</small><strong>${gaps.length}</strong><span>${L('Partial or not met only','جزئي أو غير مستوفٍ فقط')}</span></div><div class="stat"><small>${T('actionleft')}</small><strong>${openActions}</strong><span>${L('Not checked off','لم يتم إكمالها')}</span></div><div class="stat"><small>${L('Immediate findings','ملاحظات عاجلة')}</small><strong>${gaps.filter(x=>urgency(x)==='Immediate').length}</strong><span>${L('Score ≥ 7','الدرجة ٧ أو أعلى')}</span></div></div><div class="panel"><div class="panel-head"><h2>${T('gap')}</h2><div class="legend"><span class="tag high">${T('immediate')}</span><span class="tag medium">${T('weeks')}</span><span class="tag low">${T('months')}</span></div></div><p class="callout" style="margin-bottom:15px">${L('Formula: impact (1–3) × likelihood (1–3) × gap factor (1.0 if unmet; 0.7 if partially met). ≥7 = Immediate; ≥4 = 1–2 weeks; otherwise 1–3 months. These are transparent project assumptions, not deadlines prescribed by NIST or HHS.','المعادلة: الأثر (١–٣) × الاحتمالية (١–٣) × عامل الفجوة (١ لغير المستوفى؛ ٠٫٧ للمستوفى جزئيًا). ٧ فأكثر = فوري؛ ٤ فأكثر = أسبوع إلى أسبوعين؛ وإلا = شهر إلى ثلاثة أشهر. هذه افتراضات للمشروع وليست مواعيد يفرضها NIST أو HHS.')}</p><div class="pageprint">MedSecure Global Hospitals • fictional educational simulation • generated ${new Date().toLocaleString()} • no patient data</div>${gaps.length?`<div class="scroll-x"><table class="road-table"><thead><tr><th>${L('Rank / Control','الترتيب / الضابط')}</th><th>${L('Confirmed security gap','الفجوة المثبتة')}</th><th>${T('score')} / ${T('priority')}</th><th>${T('owner')}</th><th>${T('actionleft')}</th><th>${T('due')}</th></tr></thead><tbody>${gaps.map((x,i)=>{let r=responses[x.id],un=x.actions.map((v,k)=>({v,k})).filter(o=>!(r.checks||[]).includes(o.k));return `<tr><td><b>#${i+1} · ${x.id}</b><br><span class="smallmuted">${E(x.control.split(' — ')[0])}</span></td><td><b>${E(L(x.title,x.title_ar))}</b><br>${E(L(x.question,x.question_ar))}<br><span class="smallmuted">${E(r.notes||L('Evidence not yet documented','لم توثق الأدلة بعد'))}</span></td><td><b>${score(x).toFixed(1)} / 9</b><br><span class="tag ${urgency(x)==='Immediate'?'high':urgency(x)==='1–2 weeks'?'medium':'low'}">${urgencyText(urgency(x))}</span></td><td>${E(r.owner)}</td><td>${un.length?un.map(o=>`• ${E(L(o.v,x.actions_ar[o.k]))}`).join('<br>'):L('All action boxes checked; re-verify status','اكتملت الإجراءات؛ يُرجى إعادة التحقق من الحالة')}</td><td>${E(r.date||'—')}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><b>${L('No confirmed gaps yet','لا توجد فجوات مؤكدة حتى الآن')}</b>${L('Interview the client in the Live checklist. Unassessed controls are not security findings.','قابل العميل عبر قائمة التدقيق. لا تمثل الضوابط غير المقيمة ملاحظات أمنية.')}</div>`}</div>`}
function method(){return head('AUDIT ASSURANCE',T('method'),L('Control-specific source IDs, healthcare guidance, and documented risk treatment.','رموز ضوابط محددة ومراجع صحية ومنهج معلن لمعالجة المخاطر.'))+`<div class="two-col"><div class="panel"><h2>${L('Official source references','المراجع الرسمية')}</h2><ol class="bullets"><li><b>NIST SP 800-53 Revision 5</b> — ${L('Each audit question cites a specific control ID, e.g. IA-2, SC-7, CP-9.','يرتبط كل سؤال برمز ضابط محدد مثل IA-2 وSC-7 وCP-9.')} ${anchor('https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final',L('Official NIST source','المصدر الرسمي'))}.</li><li><b>HHS Healthcare and Public Health Cybersecurity Performance Goals</b> — ${L('Voluntary healthcare-specific guidance, mapped where directly relevant.','إرشادات طوعية خاصة بالرعاية الصحية مرتبطة بالأسئلة ذات الصلة.')} ${anchor('https://hhscyber.hhs.gov/cybersecurity-performance-goals.html',L('Official HHS goals','أهداف HHS الرسمية'))}.</li></ol><p class="callout">${L('These are audit benchmarks, not a claim that a worldwide hospital is subject to US law. Regulatory duties must be assessed separately by jurisdiction.','هذه معايير مرجعية للتدقيق وليست ادعاءً بأن كل مستشفى عالمي يخضع للقانون الأمريكي. تُقيّم المتطلبات القانونية حسب كل دولة.')}</p><div style="margin-top:19px"><h3>${L('How to answer a TA probe','كيفية الإجابة عن أسئلة المعيد')}</h3><ol class="bullets"><li>${L('Read the control ID and audit question; explain the clinical risk.','اذكر رمز الضابط والسؤال واشرح أثره طبيًا.')}</li><li>${L('Open the official NIST page and search the exact control ID.','افتح موقع NIST الرسمي وابحث عن رمز الضابط.')}</li><li>${L('Show the verification actions and evidence needed.','اعرض إجراءات التحقق والأدلة المطلوبة.')}</li><li>${L('Agree with the client: compliant, partial, unmet or not applicable.','اتفق مع العميل على الحالة: مستوفٍ أو جزئي أو غير مستوفٍ أو غير منطبق.')}</li><li>${L('Export unresolved actions ordered by priority.','صدّر الإجراءات المفتوحة مرتبة حسب الأولوية.')}</li></ol></div></div><div class="panel"><h2>${L('Transparent risk model','نموذج مخاطر شفاف')}</h2><p class="muted" style="margin:9px 0 15px">${L('A consultant-defined screening model for this academic role-play. Not a NIST/HHS mandated scoring scheme.','نموذج استشاري لأغراض المشروع، وليس نظام درجات إلزاميًا من NIST/HHS.')}</p><div class="minihead">${L('Impact and likelihood','الأثر والاحتمالية')}</div><table class="road-table" style="min-width:0"><tbody><tr><td>${T('high')}</td><td><b>3</b></td></tr><tr><td>${T('medium')}</td><td><b>2</b></td></tr><tr><td>${T('low')}</td><td><b>1</b></td></tr></tbody></table><div class="minihead" style="margin-top:20px">${L('Gap factor','عامل الفجوة')}</div><p class="muted" style="font-size:12px">${L('Unmet = 1.0; partially met = 0.7; compliant, not applicable, and unassessed do not enter the gap roadmap.','غير مستوفٍ = ١؛ مستوفٍ جزئيًا = ٠٫٧؛ الحالات الأخرى لا تدخل قائمة الفجوات.')}</p><div style="margin-top:18px"><span class="tag high">≥ 7 · ${T('immediate')}</span> <span class="tag medium">≥ 4 · ${T('weeks')}</span> <span class="tag low">&lt; 4 · ${T('months')}</span></div><p class="help-note">${L('Urgency can be adjusted during discussion in response to clinical dependencies and actual evidence.','يمكن تعديل الاستعجال حسب الاعتماديات الطبية والأدلة الفعلية أثناء النقاش.')}</p></div></div>`}
function team(){let members=[['1',L('Identity & Network','الهوية والشبكات'),'IAM + NET',L('Opens the consulting meeting; interviews CISO / network manager; controls 01–08.','يبدأ المقابلة ويختبر ضوابط الهوية والشبكات ٠١–٠٨.')],['2',L('Assets & Data','الأصول والبيانات'),'AST + DAT',L('Interviews infrastructure, biomedical engineering and privacy; controls 09–16.','يُقابل البنية التحتية والهندسة الطبية والخصوصية؛ ٠٩–١٦.')],['3',L('Monitoring & Incidents','الرصد والحوادث'),'MON + INC',L('Interviews SOC and incident-response managers; controls 17–24.','يُقابل مركز العمليات والاستجابة؛ ١٧–٢٤.')],['4',L('Recovery & Vendors','التعافي والموردون'),'BCP + VEN',L('Interviews BCP and vendor risk; summarizes prioritized actions; controls 25–32.','يُقابل استمرارية الأعمال والموردين ويلخص الإجراءات؛ ٢٥–٣٢.')]];return head('CONSULTING ROLE-PLAY',T('team'),L('Four equal contributions (8 controls each) and a 15–20-minute grading walkthrough.','أربع مساهمات متساوية (٨ ضوابط لكل عضو) وخطة عرض مدتها ١٥–٢٠ دقيقة.'))+`<div class="member-grid">${members.map(m=>`<div class="member"><div class="circle">${m[0]}</div><small>${m[2]}</small><b>${m[1]}</b><p>${m[3]}</p></div>`).join('')}</div><div class="panel" style="margin-top:16px"><h2>${L('Suggested 18-minute grading agenda','جدول مقترح لجلسة ١٨ دقيقة')}</h2><div class="timeline"><div class="timecard"><span>00:00–03:30</span><b>${L('Member 1','العضو ١')}</b><p>${L('Scope, 8 access/network checks, first interactive assessment','النطاق وضوابط الهوية والشبكة والتفاعل الأول')}</p></div><div class="timecard"><span>03:30–07:00</span><b>${L('Member 2','العضو ٢')}</b><p>${L('Vulnerabilities, medical devices, EHR privacy','الثغرات والأجهزة الطبية وخصوصية السجل')}</p></div><div class="timecard"><span>07:00–10:30</span><b>${L('Member 3','العضو ٣')}</b><p>${L('Monitoring, incident plan and ransomware drill','المراقبة وخطة الحوادث ومحاكاة الفدية')}</p></div><div class="timecard"><span>10:30–14:00</span><b>${L('Member 4','العضو ٤')}</b><p>${L('Restores, continuity and vendor assurance','استعادة الأنظمة والاستمرارية والموردون')}</p></div></div><p class="callout" style="margin-top:13px">${L('14:00–18:00: everyone answers client probes, shows exact standard sources, exports final prioritized actions. Keep 2 minutes as flexibility for TA questions.','من ١٤:٠٠ إلى ١٨:٠٠: يجيب الجميع عن أسئلة العميل ويعرضون النص المرجعي ويصدّرون المعالجة المرتبة. اترك دقيقتين للمناقشة.')}</p></div>`}
function download(name,text,mime){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJson(){download('medsecure_audit_session.json',JSON.stringify({schema:'medsecure-audit-v3',exported_at:new Date().toISOString(),demo,responses},null,2),'application/json;charset=utf-8');toast(L('Session file exported','تم تصدير ملف الجلسة'))}
function csvq(v){return '"'+String(v??'').replace(/"/g,'""').replace(/^([=+@\-])/,'\'$1')+'"'}
function exportCsv(){let gaps=ITEMS.filter(isGap).sort((a,b)=>score(b)-score(a));let cols=['Rank','Control ID','Domain','Audit Question','NIST Control','HHS Goal','Assessment','Impact','Likelihood','Risk Score','Priority','Action','Action Status','Owner','Due Date','Evidence / Notes','NIST Source','HHS Source'];let rows=[cols];gaps.forEach((x,i)=>x.actions.forEach((a,j)=>rows.push([i+1,x.id,DOMAINS.find(d=>d[0]===x.domain)[1],x.question,x.control,x.hhs_goal,responses[x.id].status,x.severity,responses[x.id].like,score(x),urgency(x),a,(responses[x.id].checks||[]).includes(j)?'Done':'Unresolved',responses[x.id].owner,responses[x.id].date,responses[x.id].notes,x.nist_url,x.hhs_url])));download('medsecure_prioritized_actions.csv','\ufeff'+rows.map(r=>r.map(csvq).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast(L('Action tracker exported','تم تصدير سجل الإجراءات'))}
function loadDemo(){if(!confirm(L('Replace current answers with an explicitly fictional demo scenario? Export your session first.','هل تريد استبدال الإجابات بمثال افتراضي؟ صدّر جلستك أولًا.')))return;responses=EMPTY();let example={
 'IAM-01':'compliant','IAM-02':'noncompliant','IAM-03':'partial','IAM-04':'compliant',
 'NET-01':'noncompliant','NET-02':'partial','NET-03':'compliant','NET-04':'compliant',
 'AST-01':'partial','AST-02':'noncompliant','AST-03':'noncompliant','AST-04':'compliant',
 'DAT-01':'compliant','DAT-02':'partial','DAT-03':'pending','DAT-04':'compliant',
 'MON-01':'partial','MON-02':'compliant','MON-03':'noncompliant','MON-04':'compliant',
 'INC-01':'compliant','INC-02':'noncompliant','INC-03':'partial','INC-04':'pending',
 'BCP-01':'partial','BCP-02':'noncompliant','BCP-03':'noncompliant','BCP-04':'compliant',
 'VEN-01':'compliant','VEN-02':'partial','VEN-03':'partial','VEN-04':'compliant'};
 for(let id in example){responses[id].status=example[id];if(isGap(ITEMS.find(x=>x.id===id)))responses[id].notes=L('Simulated finding for grading demonstration; verify with the real client.','ملاحظة افتراضية للعرض يجب التحقق منها مع العميل.');}demo=true;persist();render();toast(L('Illustrative scenario loaded. Not a real audit.','تم تحميل سيناريو توضيحي غير حقيقي.'))}
function resetAll(){if(!confirm(L('Clear all audit responses? Export your session first if needed.','حذف جميع إجابات التدقيق؟ احفظ الجلسة أولًا عند الحاجة.')))return;responses=EMPTY();demo=false;persist();render();toast(L('Checklist reset to not assessed','أُعيدت القائمة إلى غير مُقيَّمة'))}
function gotoDomain(d){filters={q:'',d,s:'all',m:'all',hide:false};navTo('checklist')}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.nav){navTo(btn.dataset.nav);return}if(btn.dataset.gotoDomain){gotoDomain(btn.dataset.gotoDomain);return}if(btn.id==='lang'){lang=lang==='en'?'ar':'en';persist();render();return}if(btn.id==='export-json'){exportJson();return}if(btn.id==='import-json'){document.getElementById('file-json').click();return}if(btn.id==='demo'){loadDemo();return}if(btn.id==='export-csv'){exportCsv();return}if(btn.id==='print-report'){window.print();return}if(btn.id==='reset-all'){resetAll();return}});
document.addEventListener('change',e=>{const v=e.target;if(v.id==='file-json'){const file=v.files&&v.files[0];if(!file)return;file.text().then(str=>{let incoming;try{incoming=JSON.parse(str)}catch{throw Error('Invalid JSON')}if(!incoming.responses||typeof incoming.responses!=='object')throw Error('Unrecognized session');if(!confirm(L('Import and replace current responses?','استيراد الملف واستبدال الإجابات الحالية؟')))return;responses=EMPTY();for(const x of ITEMS){let r=incoming.responses[x.id];if(r&&typeof r==='object'){if(['pending','compliant','partial','noncompliant','na'].includes(r.status))responses[x.id].status=r.status;if(['High','Medium','Low'].includes(r.like))responses[x.id].like=r.like;for(let k of ['notes','owner','date'])if(typeof r[k]==='string')responses[x.id][k]=r[k].slice(0,2000);if(Array.isArray(r.checks))responses[x.id].checks=r.checks.filter(i=>Number.isInteger(i)&&i>=0&&i<x.actions.length)}}demo=!!incoming.demo;persist();render();toast(L('Session imported','تم استيراد الجلسة'))}).catch(e=>toast(L('Import failed: ','فشل الاستيراد: ')+e.message));v.value='';return}
 if(v.id==='filter-domain'){filters.d=v.value;render();return}if(v.id==='filter-status'){filters.s=v.value;render();return}if(v.id==='filter-member'){filters.m=v.value;render();return}if(v.id==='hide-completed'){filters.hide=v.checked;render();return}
 let id=v.dataset.id;if(!id||!responses[id])return;let r=responses[id];if(v.dataset.field){let k=v.dataset.field;if(k==='status'&&!['pending','compliant','partial','noncompliant','na'].includes(v.value))return;if(k==='like'&&!['High','Medium','Low'].includes(v.value))return;r[k]=v.value.slice(0,2000);persist();if(['status','like'].includes(k))render();else topRefresh();return}if(v.dataset.check!==undefined){let n=+v.dataset.check;let s=new Set(r.checks||[]);if(v.checked)s.add(n);else s.delete(n);r.checks=[...s].sort((a,b)=>a-b);persist();let lbl=v.closest('.action-row');if(lbl)lbl.classList.toggle('done',v.checked);return}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filters.q=e.target.value;const st=e.target.selectionStart;render();const n=document.getElementById('search');if(n){n.focus();n.setSelectionRange(st,st)}}});
render();
</script>
</body></html>
